# Zet Bijeen online: eerst de database en de meldingen-server (Supabase), daarna de app zelf (GitHub Pages).
name: Online zetten

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Database bijwerken en app online zetten
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleren of Supabase is ingesteld
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::De Supabase-gegevens staan nog niet in de GitHub-instellingen (Secrets). De app wordt wel online gezet, maar werkt pas als die er staan. Zie LEESMIJ.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest
      - name: Database bijwerken
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > supabase/migrations/20261031000200_notify_url.sql <<SQL
          insert into public.app_secrets (k, v) values ('notify_url', 'https://${REF}.supabase.co/functions/v1/notify')
            on conflict (k) do update set v = excluded.v;
          SQL
          supabase link --project-ref "$REF"
          supabase db push --include-all
      - name: Meldingen-server bijwerken
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy notify --no-verify-jwt --project-ref "$REF"
      - name: Inloggen instellen (anoniem inloggen, e-mails in het Nederlands)
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SITE="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          jq -n --arg site "$SITE" '{
            site_url: $site,
            uri_allow_list: ($site + "**"),
            external_anonymous_users_enabled: true,
            mailer_subjects_magic_link: "Je code voor Bijeen",
            mailer_templates_magic_link_content: "<h2>Bijeen</h2><p>Je code om weer in Bijeen te komen:</p><p style=\"font-size:28px;font-weight:bold;letter-spacing:4px\">{{ .Token }}</p><p>Vul deze code in de app in. Heb je dit niet aangevraagd? Dan kun je deze mail negeren.</p>",
            mailer_subjects_email_change: "Bevestig je reserve e-mail voor Bijeen",
            mailer_templates_email_change_content: "<h2>Bijeen</h2><p>Tik op de link om {{ .NewEmail }} te bevestigen als reserve e-mail. Je gebruikt dit adres alleen als je telefoon kwijt is.</p><p><a href=\"{{ .ConfirmationURL }}\">Bevestig mijn reserve e-mail</a></p>"
          }' > auth.json
          curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/${REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" --data @auth.json > /dev/null
          echo "Inloginstellingen bijgewerkt (site: $SITE)"
      - name: Sleutel voor de app ophalen
        id: keys
        if: steps.check.outputs.ready == 'true'
        run: |
          KEYS=$(supabase projects api-keys --project-ref "$REF" -o json)
          KEY=$(echo "$KEYS" | jq -r '[.[] | select(.name=="anon")][0].api_key // empty')
          if [ -z "$KEY" ]; then KEY=$(echo "$KEYS" | jq -r '[.[] | select((.type // "")=="publishable")][0].api_key // empty'); fi
          if [ -z "$KEY" ]; then echo "::error::Kon de openbare sleutel niet vinden"; exit 1; fi
          # in een bestand bewaren (GitHub geeft waarden met een geheim erin niet door tussen stappen-uitvoer)
          printf '%s\n%s\n' "https://${REF}.supabase.co" "$KEY" > "$RUNNER_TEMP/bijeen-keys"
      - name: App klaarmaken
        run: |
          URL=""; KEY=""
          if [ -f "$RUNNER_TEMP/bijeen-keys" ]; then URL=$(sed -n 1p "$RUNNER_TEMP/bijeen-keys"); KEY=$(sed -n 2p "$RUNNER_TEMP/bijeen-keys"); fi
          VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons _site/
          printf "window.BIJEEN_CONFIG = { url: '%s', anonKey: '%s' };\nwindow.BIJEEN_VERSION = '%s';\n" "$URL" "$KEY" "$VERSION" > _site/js/config.js
          sed -i "s/const VERSION = 'dev';/const VERSION = '${VERSION}';/" _site/sw.js
          touch _site/.nojekyll
          if [ -n "$KEY" ]; then echo "App gekoppeld aan de server"; else echo "::warning::App staat online zonder serverkoppeling"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
